name: Update leaderboard

on:
  schedule:
    - cron: "15 * * * *"     # setiap jam di menit ke-15 (mis. 19.15 WIB)
  workflow_dispatch:          # tombol "Run workflow" untuk menjalankan manual
  push:
    branches: [main]
    paths: ["docs/**", "config.json", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Hitung komentar
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/update.py

      - name: Simpan hasil ke repo
        id: commit
        run: |
          git add data docs/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "garunesia-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update leaderboard"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Siapkan GitHub Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - name: Unggah website
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Terbitkan website
        id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
