name: Update leaderboard

on:
  schedule:
    - cron: "15 * * * *"     # setiap jam di menit ke-15 (mis. 19.15 WIB)
  workflow_dispatch:          # tombol "Run workflow" untuk menjalankan manual
  push:
    branches: [main]
    paths: ["docs/**", "styles/**", "config.json", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  # 1) Hitung komentar, simpan hasil, siapkan file website
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Hitung komentar
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/update.py

      - name: Simpan hasil ke repo
        run: |
          git add data docs/data
          if ! git diff --cached --quiet; then
            git config user.name "garunesia-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update leaderboard"
            git pull --rebase
            git push
          fi

      - name: Bangun CSS (Tailwind)
        run: |
          curl -sSLo tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.11/tailwindcss-linux-x64
          chmod +x tailwindcss
          ./tailwindcss -i styles/app.css -o docs/app.css --minify
          rm tailwindcss

      - uses: actions/configure-pages@v5

      - name: Unggah website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  # 2) Terbitkan ke GitHub Pages (dicoba ulang sekali kalau GitHub sedang gangguan)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - name: Terbitkan website
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Tunggu sebentar lalu coba lagi
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - name: Terbitkan website (percobaan kedua)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
